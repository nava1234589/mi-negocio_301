{% extends 'base.html' %}

{% block title %}Eliminar producto | Papelería Momita{% endblock %}

{% block content %}

<div class="card">

    <p class="breadcrumb">
        Inicio / Productos / Confirmar eliminación
    </p>

    <h2>¿Eliminar producto? 💜</h2>

    <p>
        ¿Estás seguro de eliminar el producto
        <strong>{{ producto.nombre }}</strong>?
    </p>

    <form method="post"
          data-confirm="¿Seguro que deseas eliminar este producto?">

        {% csrf_token %}

        <button type="submit" class="btn btn-danger">
            Sí, eliminar
        </button>

        <a href="{% url 'lista_productos' %}"
           class="btn btn-secondary">
            Cancelar
        </a>

    </form>

</div>

{% endblock %}
