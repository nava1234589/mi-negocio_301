{% extends 'base.html' %}

{% block title %}{{ titulo }} | Papelería Momita{% endblock %}

{% block content %}

<div class="card">

    <p class="breadcrumb">Inicio / Productos / Formulario</p>

    <h2>💜 {{ titulo }}</h2>

    <p>Completa los datos del producto.</p>

    <form method="post">
        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit" class="btn btn-primary">
            Guardar producto
        </button>

        <a href="{% url 'lista_productos' %}"
           class="btn btn-secondary">
            Cancelar
        </a>
    </form>

</div>

{% endblock %}|
